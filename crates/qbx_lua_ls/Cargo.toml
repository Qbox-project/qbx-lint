[package]
name = "qbx_lua_ls"
description = "Language server for FiveM Lua"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qbx-lua-ls"
path = "src/main.rs"

[dependencies]
qbx_lua_syntax.workspace = true
qbx_lua_fmt.workspace = true
qbx_lua_analysis = { workspace = true, features = ["docs"] }
qbx_fivem_data = { workspace = true, features = ["docs"] }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rustc-hash.workspace = true
smol_str.workspace = true
walkdir = "2"
