name: Feature request
description: Suggest a change to the linter, formatter, language server, or shared analysis.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would help?
      description: Name the affected tool or shared behavior and describe the change, with an example if possible.
    validations:
      required: true
