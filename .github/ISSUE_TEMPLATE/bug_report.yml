name: Bug report
description: Report a problem with the linter, formatter, or language server.
body:
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Name the affected tool (qbx-lint or qbx-lua-ls), its version, your operating system, and your editor/LSP client if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Include a small Lua example, relevant manifest entries, and the command or editor action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error message or relevant output. Remove secrets and private server details.
    validations:
      required: true
