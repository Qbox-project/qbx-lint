name: Update natives
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo xtask natives

      - name: Summarize changes
        id: diff
        run: |
          file=crates/qbx_fivem_data/data/natives.tsv
          if git diff --quiet -- crates/qbx_fivem_data/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "HEAD:$file" | cut -f1 | sort > before.txt
          cut -f1 "$file" | sort > after.txt
          {
            echo "changed=true"
            echo "body<<EOF"
            echo "Regenerated from runtime.fivem.net by \`cargo xtask natives\`."
            echo
            echo "**Added ($(comm -13 before.txt after.txt | wc -l))**"
            comm -13 before.txt after.txt | head -100 | sed 's/^/- `/; s/$/`/'
            echo
            echo "**Removed ($(comm -23 before.txt after.txt | wc -l))**"
            comm -23 before.txt after.txt | head -100 | sed 's/^/- `/; s/$/`/'
            echo
            echo "Signature or documentation changes of existing natives are in the diff."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm before.txt after.txt

      - if: steps.diff.outputs.changed == 'true'
        run: cargo test --workspace

      - if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-natives
          commit-message: 'chore(data): update natives from runtime.fivem.net'
          title: 'chore(data): update natives from runtime.fivem.net'
          body: ${{ steps.diff.outputs.body }}
          add-paths: crates/qbx_fivem_data/data
          delete-branch: true
